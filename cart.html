<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - ShopSphere</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">🛍️ ShopSphere</a>
    <button class="hamburger" id="hamburger-btn">☰</button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="wishlist.html" class="nav-icon-link">❤️ Wishlist <span class="nav-badge" id="wishlist-badge">0</span></a>
      <a href="cart.html" class="active nav-icon-link">🛒 Cart <span class="nav-badge" id="cart-badge">0</span></a>
    </div>
  </nav>

  <div class="section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
      <h1>Shopping Cart</h1>
      <button onclick="clearCartAll()" style="background:none; border:1px solid #ef4444; color:#ef4444; padding:6px 12px; border-radius:8px; font-weight:700">Clear Cart</button>
    </div>

    <div id="cart-content"></div>
  </div>

  <script src="app.js"></script>
  <script>
    function renderCart() {
      const container = document.getElementById('cart-content');
      if (cart.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:60px">
            <h1 style="font-size:64px">🛒</h1>
            <h2>Your cart is empty</h2>
            <br>
            <a href="products.html"><button class="btn-primary">Browse Products</button></a>
          </div>
        `;
        return;
      }

      // Calculate Subtotal & Totals directly in INR
      const subtotalINR = cart.reduce((sum, item) => sum + (Number(item.price) || 0) * item.quantity, 0);
      const shipping = subtotalINR > 3999 || subtotalINR === 0 ? 0 : 499;
      const gst = Math.round(subtotalINR * 0.18);
      const grandTotal = subtotalINR + shipping + gst;

      container.innerHTML = `
        <div class="cart-layout">
          <div>
            ${cart.map(item => `
              <div class="cart-item">
                <img src="${item.thumbnail}" alt="${item.title}" />
                <div style="flex:1">
                  <h4>${item.title}</h4>
                  <p style="color:#64748b; font-size:13px">${formatINR(item.price)}</p>
                </div>
                <div>
                  <button onclick="updateQty('${item.id}', -1)" style="padding:4px 10px; font-weight:bold; cursor:pointer">−</button>
                  <span style="margin: 0 10px; font-weight:700">${item.quantity}</span>
                  <button onclick="updateQty('${item.id}', 1)" style="padding:4px 10px; font-weight:bold; cursor:pointer">+</button>
                </div>
                <p style="font-weight:800; min-width:90px; text-align:right">${formatINR(item.price * item.quantity)}</p>
                <button onclick="removeItem('${item.id}')" style="background:none; border:none; color:#ef4444; margin-left:14px; cursor:pointer; font-size:18px">✕</button>
              </div>
            `).join('')}
          </div>

          <div class="cart-summary">
            <h2>Order Summary</h2>
            <div class="summary-row"><span>Subtotal</span><span>₹${subtotalINR.toLocaleString('en-IN')}</span></div>
            <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : '₹' + shipping}</span></div>
            <div class="summary-row"><span>GST (18%)</span><span>₹${gst.toLocaleString('en-IN')}</span></div>
            <div class="summary-row" style="font-size:18px; font-weight:800; border-top:2px solid #0f172a; margin-top:10px; padding-top:12px">
              <span>Total</span><span>₹${grandTotal.toLocaleString('en-IN')}</span>
            </div>
            <a href="checkout.html"><button class="btn-primary" style="width:100%; margin-top:20px">Proceed to Checkout</button></a>
          </div>
        </div>
      `;
    }

    function updateQty(id, delta) {
      const item = cart.find(i => String(i.id) === String(id));
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) cart = cart.filter(i => String(i.id) !== String(id));
        saveCart();
        renderCart();
      }
    }

    function removeItem(id) {
      cart = cart.filter(i => String(i.id) !== String(id));
      saveCart();
      renderCart();
    }

    function clearCartAll() {
      cart = [];
      saveCart();
      renderCart();
    }

    renderCart();
  </script>
</body>
</html>
